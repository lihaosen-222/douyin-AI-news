<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="来自抖音知识库的每日 AI 新闻摘要">
  <meta name="color-scheme" content="light">
  <title>抖音 AI 日报</title>
  <style>
    :root {
      --paper: #f7f7f4;
      --surface: #ffffff;
      --ink: #171917;
      --muted: #626862;
      --line: #d9ddd7;
      --green: #0b6b50;
      --green-soft: #dceee7;
      --red: #a83b32;
      --yellow: #e8ba4b;
      --max-width: 1120px;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
      line-height: 1.7;
    }

    a { color: inherit; }

    .masthead {
      border-top: 5px solid var(--green);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .masthead-inner,
    main,
    .footer-inner {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
    }

    .masthead-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 19px;
    }

    .brand-mark {
      width: 13px;
      height: 28px;
      background: var(--green);
      box-shadow: 6px 6px 0 var(--yellow);
    }

    .edition {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    main { padding: 54px 0 80px; }

    .lead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 52px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--ink);
    }

    .kicker {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .overview {
      max-width: 780px;
      margin: 24px 0 0;
      color: #363a36;
      font-size: 18px;
    }

    .stat {
      align-self: end;
      border-left: 4px solid var(--red);
      padding-left: 18px;
    }

    .stat-value {
      display: block;
      font-family: Georgia, serif;
      font-size: 58px;
      line-height: 1;
    }

    .stat-label {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      padding: 42px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.3;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--ink);
    }

    .highlight {
      min-width: 0;
      padding: 24px 24px 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .highlight:not(:nth-child(3n + 1)) {
      padding-left: 24px;
      border-left: 1px solid var(--line);
    }

    .tag {
      display: inline-block;
      margin-bottom: 13px;
      padding: 2px 8px;
      color: var(--green);
      background: var(--green-soft);
      border-radius: 3px;
      font-size: 12px;
      font-weight: 800;
    }

    .highlight h3,
    .story h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .highlight p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stories { border-top: 1px solid var(--ink); }

    .story {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 28px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .story-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .story-meta strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
    }

    .story-summary { margin: 10px 0 0; }

    .why {
      margin: 14px 0 0;
      padding-left: 14px;
      border-left: 3px solid var(--yellow);
      color: #454945;
      font-size: 14px;
    }

    .source-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      text-underline-offset: 4px;
    }

    .empty {
      padding: 44px 0;
      color: var(--muted);
      border-top: 1px solid var(--ink);
    }

    footer {
      background: var(--ink);
      color: #d7dbd6;
    }

    .footer-inner {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 12px;
    }

    .footer-inner p { margin: 0; }

    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      .masthead-inner,
      main,
      .footer-inner { width: min(calc(100% - 28px), var(--max-width)); }

      .masthead-inner { min-height: 68px; }
      main { padding: 36px 0 56px; }

      .lead {
        grid-template-columns: 1fr;
        gap: 28px;
        padding-bottom: 36px;
      }

      h1 { font-size: 40px; }
      .overview { font-size: 16px; }
      .stat { align-self: auto; }
      .stat-value { font-size: 44px; }

      .section { padding: 34px 0; }
      .section-heading { display: block; }
      .section-note { margin-top: 6px; }

      .highlights { grid-template-columns: 1fr; }
      .highlight,
      .highlight:not(:nth-child(3n + 1)) {
        padding: 20px 0;
        border-left: 0;
      }

      .story {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 24px 0;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>抖音 AI 日报</div>
      <div class="edition"><span id="edition-date">等待首次更新</span><br>Asia/Shanghai</div>
    </div>
  </header>

  <main>
    <section class="lead" aria-labelledby="page-title">
      <div>
        <p class="kicker">DAILY INTELLIGENCE BRIEF</p>
        <h1 id="page-title">暂时还没有日报</h1>
        <p class="overview" id="overview">完成第一次全量采集后，这里会展示最新的抖音 AI 新闻总结。</p>
      </div>
      <div class="stat" aria-label="收录视频数量">
        <span class="stat-value" id="source-count">0</span>
        <span class="stat-label">条视频原文</span>
      </div>
    </section>

    <section class="section" id="highlights-section" hidden>
      <div class="section-heading">
        <h2>重点动态</h2>
        <p class="section-note">从当日全部原文提炼</p>
      </div>
      <div class="highlights" id="highlights"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>视频摘要</h2>
        <p class="section-note" id="generated-at">尚未生成</p>
      </div>
      <div class="stories" id="stories" hidden></div>
      <div class="empty" id="empty-state">暂无内容。最近一次成功任务的结果会出现在这里。</div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>内容来自“得到大脑”抖音知识库</p>
      <p>仅依据原始文本生成 · T-3 自然日口径</p>
    </div>
  </footer>

  <script type="application/json" id="daily-news-data">

  </script>
  <script>
    (() => {
      const dataNode = document.getElementById("daily-news-data");

      try {
        const data = JSON.parse(dataNode.textContent);
        const items = Array.isArray(data.items) ? data.items : [];
        const highlights = Array.isArray(data.highlights) ? data.highlights : [];
        const count = Number.isFinite(data.sourceCount) ? data.sourceCount : items.length;

        document.getElementById("page-title").textContent = data.headline || "抖音 AI 日报";
        document.getElementById("overview").textContent = data.overview || "";
        document.getElementById("source-count").textContent = String(count);

        if (data.targetDate) {
          document.getElementById("edition-date").textContent = formatDate(data.targetDate);
        }

        if (data.generatedAt) {
          document.getElementById("generated-at").textContent = `生成于 ${formatDateTime(data.generatedAt)}`;
        }

        if (highlights.length) {
          const root = document.getElementById("highlights");
          highlights.forEach((item) => {
            const article = document.createElement("article");
            article.className = "highlight";
            article.append(
              element("span", "tag", item.tag || "动态"),
              element("h3", "", item.title || "未命名重点"),
              element("p", "", item.summary || "")
            );
            root.appendChild(article);
          });
          document.getElementById("highlights-section").hidden = false;
        }

        if (items.length) {
          const root = document.getElementById("stories");
          items.forEach((item) => root.appendChild(renderStory(item)));
          root.hidden = false;
          document.getElementById("empty-state").hidden = true;
        } else if (data.targetDate) {
          document.getElementById("empty-state").textContent = "当日未发现视频。";
        }
      } catch (error) {
        console.error("日报数据无法解析", error);
        document.getElementById("empty-state").textContent = "日报数据暂时无法读取，请检查生成结果。";
      }

      function renderStory(item) {
        const article = document.createElement("article");
        article.className = "story";

        const meta = document.createElement("div");
        meta.className = "story-meta";
        meta.append(
          element("strong", "", item.creator || "未知博主"),
          document.createTextNode(item.publishedAt ? formatTime(item.publishedAt) : "时间未说明")
        );

        const content = document.createElement("div");
        content.append(
          element("h3", "", item.title || "未命名视频"),
          element("p", "story-summary", item.summary || "原文未提供可用摘要。")
        );

        if (item.whyItMatters) {
          content.appendChild(element("p", "why", `值得关注：${item.whyItMatters}`));
        }

        if (isHttpUrl(item.sourceUrl)) {
          const link = element("a", "source-link", "查看原始来源");
          link.href = item.sourceUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          content.appendChild(link);
        }

        article.append(meta, content);
        return article;
      }

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.textContent = text;
        return node;
      }

      function isHttpUrl(value) {
        if (!value) return false;
        try {
          const url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(new Date(`${value}T00:00:00+08:00`));
      }

      function formatDateTime(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(new Date(value));
      }

      function formatTime(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(new Date(value));
      }
    })();
  </script>
</body>
</html>
